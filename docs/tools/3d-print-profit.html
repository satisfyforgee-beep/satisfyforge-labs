<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>3D Print Profit Calculator | SatisfyForge</title><style>body{font-family:system-ui;background:#061018;color:#eef5ff;margin:0}.w{max-width:820px;margin:auto;padding:24px}.b{background:#0d1925;border:1px solid #263f59;border-radius:18px;padding:20px}.g{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-size:12px;color:#9cadc0}input{width:100%;box-sizing:border-box;margin-top:5px;padding:11px;background:#07121d;color:#fff;border:1px solid #31506f;border-radius:9px}button{width:100%;padding:13px;margin-top:15px;border:0;border-radius:10px;background:#1687ff;color:white;font-weight:900}.o{white-space:pre-wrap;margin-top:14px;background:#07121d;border-radius:12px;padding:16px}.muted{color:#9cadc0}@media(max-width:650px){.g{grid-template-columns:1fr}}</style></head><body><div class='w'><a href='../index.html' style='color:#63c9ff'>← SatisfyForge Toolbox</a><h1>3D Print Profit Calculator</h1><p class='muted'>Price prints using material, electricity, machine time, failure risk, labor and marketplace fees.</p><div class='b'><div class='g'><label>Selling price ($)<input id='price' type='number' value='35'></label><label>Print time (hours)<input id='hours' type='number' step='.1' value='7'></label><label>Filament used (grams)<input id='grams' type='number' value='180'></label><label>Spool cost per kg ($)<input id='spool' type='number' value='22'></label><label>Printer average watts<input id='watts' type='number' value='120'></label><label>Electricity $/kWh<input id='kwh' type='number' step='.01' value='.16'></label><label>Machine cost / hour ($)<input id='machine' type='number' step='.1' value='.75'></label><label>Hands-on labor ($)<input id='labor' type='number' value='4'></label><label>Failure allowance (%)<input id='fail' type='number' value='8'></label><label>Platform/payment fees (%)<input id='fee' type='number' value='10'></label></div><button onclick='calc()'>Calculate profit</button><div id='out' class='o'></div></div><p class='muted'>Want a branded quote calculator or printable-product pricing system? <a style='color:#63c9ff' href='mailto:satisfyforgee@gmail.com?subject=3D%20Print%20Tool'>Contact SatisfyForge</a>.</p></div><script>const v=x=>+document.getElementById(x).value||0,m=n=>n.toLocaleString('en-US',{style:'currency',currency:'USD'});function calc(){let mat=v('grams')/1000*v('spool'),elec=v('hours')*v('watts')/1000*v('kwh'),mach=v('hours')*v('machine'),base=mat+elec+mach+v('labor'),risk=base*v('fail')/100,fees=v('price')*v('fee')/100,cost=base+risk+fees,profit=v('price')-cost,margin=v('price')?profit/v('price')*100:0,breakeven=(base+risk)/(1-v('fee')/100);out.textContent=`Material: ${m(mat)}\nElectricity: ${m(elec)}\nMachine time: ${m(mach)}\nLabor: ${m(v('labor'))}\nFailure allowance: ${m(risk)}\nPlatform/payment fees: ${m(fees)}\n\nTotal estimated cost: ${m(cost)}\nProfit: ${m(profit)}\nMargin: ${margin.toFixed(1)}%\nBreak-even sale price: ${m(breakeven)}`};calc()</script></body></html>
