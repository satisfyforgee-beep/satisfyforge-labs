<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Overtime & Double-Time Paycheck Calculator | SatisfyForge</title><style>body{font-family:system-ui;background:#071018;color:#f3f7fb;margin:0}.w{max-width:760px;margin:auto;padding:24px}.box{background:#0d1824;border:1px solid #243d57;border-radius:18px;padding:20px}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;color:#9fb1c4}input{width:100%;box-sizing:border-box;margin-top:5px;padding:11px;border:1px solid #31506e;background:#06111c;color:white;border-radius:9px}button{width:100%;padding:13px;margin-top:15px;border:0;border-radius:10px;background:#1687ff;color:white;font-weight:800}.o{white-space:pre-wrap;background:#06111c;border-radius:12px;padding:16px;margin-top:14px}.muted{color:#9fb1c4}@media(max-width:650px){.g{grid-template-columns:1fr}}</style></head><body><div class='w'><a href='../index.html' style='color:#69cfff'>← SatisfyForge Toolbox</a><h1>Paycheck Calculator</h1><p class='muted'>Regular + overtime + double-time with an estimated withholding/deduction view.</p><div class='box'><div class='g'><label>Hourly rate ($)<input id='rate' type='number' step='.01' value='23.23'></label><label>Regular hours<input id='reg' type='number' value='40'></label><label>Overtime hours (1.5×)<input id='ot' type='number' value='20'></label><label>Double-time hours (2×)<input id='dt' type='number' value='8'></label><label>Estimated taxes / withholding (%)<input id='tax' type='number' value='22'></label><label>Other deductions ($)<input id='ded' type='number' value='100'></label></div><button onclick='calc()'>Calculate paycheck</button><div class='o' id='out'></div></div><p class='muted'>This is an estimate, not payroll/tax advice. Actual withholding varies by filing status, benefits, garnishments, pretax deductions and employer payroll rules.</p></div><script>const v=x=>+document.getElementById(x).value||0,m=n=>n.toLocaleString('en-US',{style:'currency',currency:'USD'});function calc(){let r=v('rate'),regular=r*v('reg'),ot=r*1.5*v('ot'),dt=r*2*v('dt'),gross=regular+ot+dt,taxes=gross*v('tax')/100,net=gross-taxes-v('ded');out.textContent=`Regular pay: ${m(regular)}\nOvertime pay: ${m(ot)}\nDouble-time pay: ${m(dt)}\n\nGross pay: ${m(gross)}\nEstimated withholding: -${m(taxes)}\nOther deductions: -${m(v('ded'))}\n\nESTIMATED TAKE-HOME: ${m(net)}`};calc()</script></body></html>
