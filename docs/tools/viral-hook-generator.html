<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Short-Form Hook Generator | SatisfyForge</title><style>body{font-family:system-ui;background:#071018;color:#f3f7fb;margin:0}.w{max-width:800px;margin:auto;padding:24px}.box{background:#0e1926;border:1px solid #29445f;border-radius:18px;padding:20px}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;color:#9eafc1}input,select{width:100%;box-sizing:border-box;padding:11px;margin-top:5px;border-radius:9px;border:1px solid #31506e;background:#07131f;color:#fff}button{width:100%;padding:13px;margin-top:15px;border:0;border-radius:10px;background:#1687ff;color:white;font-weight:900}.o{white-space:pre-wrap;margin-top:14px;background:#07131f;padding:16px;border-radius:12px;line-height:1.5}.muted{color:#9eafc1}@media(max-width:650px){.g{grid-template-columns:1fr}}</style></head><body><div class='w'><a href='../index.html' style='color:#69cfff'>← SatisfyForge Toolbox</a><h1>Short-Form Hook Generator</h1><p class='muted'>Generate attention hooks without copying somebody else’s exact video.</p><div class='box'><div class='g'><label>Niche<input id='niche' placeholder='home services, fitness, money, gaming...'></label><label>Topic<input id='topic' placeholder='roof leaks, leg day, side hustles...'></label><label>Audience<input id='aud' placeholder='homeowners, beginners, parents...'></label><label>Style<select id='style'><option>Curiosity</option><option>Contrarian</option><option>Problem/Solution</option><option>Proof</option><option>Story</option></select></label></div><button onclick='gen()'>Generate 20 hooks</button><div class='o' id='out'></div></div></div><script>const pick=(a,i)=>a[i%a.length];function gen(){let n=niche.value||'your niche',t=topic.value||'your topic',a=aud.value||'people',s=style.value;let p=[`Most ${a} don’t realize this about ${t}…`,`Before you spend money on ${t}, watch this.`,`I wish somebody told me this before I learned ${t}.`,`The fastest way to mess up ${t} is surprisingly common.`,`Here’s what ${n} pros notice that beginners miss.`,`This looks normal until you know what to look for.`,`I tested the “cheap” way to handle ${t}. Here’s what happened.`,`3 things I’d never do again with ${t}.`,`If you only remember one thing about ${t}, make it this.`,`The part nobody shows you about ${t}.`,`You don’t need more motivation — you need this fix for ${t}.`,`This one change makes ${t} way easier.`,`What people think works for ${t} vs. what actually works.`,`I used to believe this about ${t} too.`,`Here’s the 30-second version of ${t} nobody explains clearly.`,`If ${t} keeps failing, check this first.`,`The “boring” detail that makes the biggest difference in ${t}.`,`A real example of what good ${t} looks like.`,`Stop scrolling if you’re about to deal with ${t}.`,`Send this to somebody who keeps struggling with ${t}.`];out.textContent=`Style: ${s}\n\n`+p.map((x,i)=>`${i+1}. ${x}`).join('\n')}</script></body></html>
