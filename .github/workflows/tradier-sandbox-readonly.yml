name: Tradier Sandbox Validation and Protected Order Preview

on:
  push:
    branches:
      - feature/tradier-paper-lifecycle-20261020
      - feature/tradier-reconciliation-v06-20261020
      - feature/tradier-one-share-paper-20261021
    paths:
      - .github/workflows/tradier-sandbox-readonly.yml
      - scripts/tradier_sandbox_check.py
      - tests/test_tradier_sandbox_check.py
      - algo-trading/tradier_paper_cli.py
      - algo-trading/zerocost_bot/tradier_paper.py
      - algo-trading/tests/test_tradier_paper.py
      - algo-trading/tests/test_tradier_paper_cli.py
      - algo-trading/zerocost_bot/tradier_reconciliation.py
      - algo-trading/zerocost_bot/paper_supervisor.py
      - algo-trading/tradier_watch.py
      - algo-trading/tests/test_tradier_reconciliation.py
      - algo-trading/tests/test_paper_supervisor.py
      - algo-trading/zerocost_bot/dashboard_model.py
      - algo-trading/dashboard_server.py
      - algo-trading/tests/test_dashboard.py
  workflow_dispatch:

# This single workflow REUSES the existing sandbox verifier and repo secret.
# No production keys, cloud order submission or live-money routes.
permissions:
  contents: read

jobs:
  offline-validation:
    name: Offline tests (always run, no broker secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout trusted branch
        uses: actions/checkout@v4

      - name: Existing Tradier read-only safety tests
        run: python3 -m unittest discover -s tests -p 'test_tradier_sandbox_check.py' -q

      - name: All Trading Lab paper risk tests
        working-directory: algo-trading
        run: |
          python3 -m unittest discover -s tests -q
          python3 -m compileall -q zerocost_bot tradier_paper_cli.py

  sandbox-preview:
    # Current GitHub Sandbox secret gave Tradier HTTP 401 on 2026-10-20.
    # Keep CI green for local code without repeatedly hitting the bad token.
    # Run only when owner has securely corrected the stored Sandbox token.
    # Safe broker preview is MANUAL ONLY. Pushes run offline tests, without
    # touching the brokerage network or reusing its API key.
    if: github.event_name == 'workflow_dispatch'
    needs: offline-validation
    name: Explicit sandbox identity + preview=true (NO ORDER)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4

      - name: Confirm sandbox authentication and delayed SPY quote
        env:
          TRADIER_SANDBOX_TOKEN: ${{ secrets.TRADIER_SANDBOX_TOKEN }}
        run: |
          unset SF_TRADIER_PAPER_ENABLE
          if [ -z "$TRADIER_SANDBOX_TOKEN" ]; then
            echo "Tradier SANDBOX token not configured."
            exit 1
          fi
          python3 scripts/tradier_sandbox_check.py --symbol SPY

      - name: Verify OTOCO order through sandbox preview=true ONLY
        env:
          TRADIER_SANDBOX_TOKEN: ${{ secrets.TRADIER_SANDBOX_TOKEN }}
        run: |
          unset SF_TRADIER_PAPER_ENABLE
          python3 algo-trading/tradier_paper_cli.py --symbol SOFI --preview
