name: Validate SatisfyForge Growth Toolbox

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'satisfyforge-site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate free-site source
        run: |
          test -f satisfyforge-site/index.html
          test -f satisfyforge-site/styles.css
          test -d docs
          echo "SatisfyForge site source is present. Production hosting is the existing free Wix site; GitHub Pages deployment is intentionally disabled."
