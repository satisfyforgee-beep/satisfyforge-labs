name: Validate SatisfyForge Growth Toolbox

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'satisfyforge-site/**'
      - 'commerce/**'
      - 'scripts/validate_commerce_safety.py'
      - 'tests/test_commerce_safety.py'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'satisfyforge-site/**'
      - 'commerce/**'
      - 'scripts/validate_commerce_safety.py'
      - 'tests/test_commerce_safety.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate free-site source
        run: |
          test -f satisfyforge-site/index.html
          test -f satisfyforge-site/styles.css
          test -d docs
          python scripts/validate_commerce_safety.py
          python -m unittest discover -s tests -p "test_commerce_safety.py" -v
          echo "SatisfyForge site source is present and quarantined checkout links are absent. Production hosting is the existing free Wix site; GitHub Pages deployment is intentionally disabled."
