name: SatisfyForge Direct Publisher

on:
  push:
    branches: [main]
    paths:
      - "publisher/**"
      - "scripts/check_no_embedded_tokens.py"
      - ".github/workflows/satisfyforge-direct-publisher.yml"
  pull_request:
    paths:
      - "publisher/**"
      - "scripts/check_no_embedded_tokens.py"
      - ".github/workflows/satisfyforge-direct-publisher.yml"
  schedule:
    # Ready for a free 30-minute poll; publishing remains disabled until approved.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: satisfyforge-direct-publisher
  cancel-in-progress: false

jobs:
  validate:
    # Validate code/PR changes even while publishing is off. Skip idle scheduled runs.
    if: ${{ github.event_name != 'schedule' || (vars.DIRECT_PUBLISHER_ENABLED == 'true' && vars.DIRECT_PUBLISHER_IDENTITY_VERIFIED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Credential guard
        run: python scripts/check_no_embedded_tokens.py

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.5

      - name: Syntax and contract checks
        working-directory: publisher
        run: |
          python -m py_compile run.py run_v2.py preflight.py test_*.py
          python -m unittest discover -v
          python preflight.py

  publish:
    needs: validate
    # Live publishing is allowed only from main and requires both cutover and verified-account gates.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DIRECT_PUBLISHER_ENABLED == 'true' && vars.DIRECT_PUBLISHER_IDENTITY_VERIFIED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.5

      - name: Run direct publisher
        working-directory: publisher
        env:
          SF_DIRECT_PUBLISHER_ENABLED: ${{ vars.DIRECT_PUBLISHER_ENABLED }}
          SF_PUBLISH_ACCOUNT_IDENTITY_VERIFIED: ${{ vars.DIRECT_PUBLISHER_IDENTITY_VERIFIED }}
          SF_PUBLISH_ACCOUNT_IDENTITY: ${{ vars.DIRECT_PUBLISHER_ACCOUNT_IDENTITY }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_FB_PAGE_ID: ${{ secrets.META_FB_PAGE_ID }}
          META_FB_PAGE_ACCESS_TOKEN: ${{ secrets.META_FB_PAGE_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: python run_v2.py

      - name: Persist publisher state
        if: github.event_name != 'push'
        shell: bash
        run: |
          if git diff --quiet -- publisher/state.json; then
            echo "No publisher state change."
            exit 0
          fi
          git config user.name "satisfyforge-publisher[bot]"
          git config user.email "satisfyforge-publisher@users.noreply.github.com"
          git add publisher/state.json
          git commit -m "Update direct publisher state [skip ci]"
          git push
