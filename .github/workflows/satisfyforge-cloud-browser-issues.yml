name: SatisfyForge Cloud Browser Jobs

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  browser-job:
    if: startsWith(github.event.issue.title, '[SF Browser]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SF_BROWSER_STATE_GZIP_B64: ${{ secrets.SF_BROWSER_STATE_GZIP_B64 }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse browser job
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const body = process.env.ISSUE_BODY || '';
          const task = body.match(/^task:\s*([^\r\n]+)$/mi)?.[1]?.trim() || 'smoke';
          const rawMutate = body.match(/^allowMutations:\s*([^\r\n]+)$/mi)?.[1]?.trim().toLowerCase() || 'false';
          const allowMutations = rawMutate === 'true';
          fs.appendFileSync(process.env.GITHUB_ENV, `SF_TASK=${task}\nSF_ALLOW_MUTATIONS=${allowMutations}\n`);
          NODE

      - name: Install Playwright
        working-directory: browser-runner
        run: |
          npm install --no-fund --no-audit
          npx playwright install --with-deps chromium

      - name: Run browser job
        id: browser
        continue-on-error: true
        working-directory: browser-runner
        run: node src/runner.mjs

      - name: Post sanitized result
        if: always()
        shell: bash
        run: |
          {
            echo '### SatisfyForge Cloud Browser result'
            echo
            echo '```json'
            if [ -f browser-runner/result.json ]; then
              cat browser-runner/result.json
            else
              echo '{"ok":false,"code":"NO_RESULT_FILE"}'
            fi
            echo '```'
          } > /tmp/sf-browser-comment.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/sf-browser-comment.md

      - name: Fail workflow when task failed
        if: steps.browser.outcome == 'failure'
        run: exit 1
