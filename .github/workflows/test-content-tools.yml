name: Test content tools
on:
  push:
    branches:
      - main
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'trading-lab/**'
      - 'algo-trading/**'
      - 'video-engine/**'
      - '.github/workflows/test-content-tools.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'trading-lab/**'
      - 'algo-trading/**'
      - 'video-engine/**'
      - '.github/workflows/test-content-tools.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run content workflow tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s trading-lab -p 'test_*.py' -v
          PYTHONPATH=algo-trading python -m unittest discover -s algo-trading/tests -p 'test_*.py' -v
          python -m unittest discover -s video-engine -p 'test_*.py' -v
