name: Brainrot Rush source contract

on:
  push:
    paths:
      - "src/roblox/**"
      - "tests/roblox/**"
      - ".github/workflows/brainrot-rush-source-contract.yml"
  pull_request:
    paths:
      - "src/roblox/**"
      - "tests/roblox/**"
      - ".github/workflows/brainrot-rush-source-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate Brainrot Rush contracts
        run: python3 tests/roblox/validate_brainrot_rush.py
      - name: Validate Snackquake gameplay and persistence contracts
        run: python3 src/roblox/snackquake/tests/run_tests.py
      - name: Check Roblox tooling Python syntax
        run: python3 -m py_compile tools/roblox-studio/run_smoke.py tools/roblox-studio/publish_place.py
